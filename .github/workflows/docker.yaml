name: Docker Access

# Exercises the docker policy this repo declares in .localmostrc.
#
# Two jobs run the same composite action:
#
#   docker-linux     GitHub-hosted, Docker native, nothing sandboxed. Confirms
#                    the workflow itself is sound where localmost is absent.
#   docker-localmost The self-hosted runner, where the daemon is reachable only
#                    through the filtering socket localmost serves the job
#                    (DOCKER_HOST), checked against the policy. This is the
#                    end-to-end test of the policy on a real job. It runs on
#                    every push: with no localmost runner online it queues for
#                    one rather than reporting a skip.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    # Named so it is tellable apart from the other workflows' check jobs in the
    # PR checks list, where three of them appear.
    name: docker runner
    uses: ./.github/workflows/check.yaml
    with:
      fallback: ubuntu-latest

  docker-linux:
    # Deliberately independent of the check job: it runs GitHub-hosted whatever
    # the heartbeat says, so depending on check would only mean a cancelled
    # check cancels this too. The heartbeat is announced by check itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-access

  docker-localmost:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-access
