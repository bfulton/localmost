name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    # Use the check workflow from the same ref (branch/SHA) as this workflow.
    # Named to distinguish it from the other workflows' check jobs; the job id
    # stays `check`, which is what `needs:` below refers to.
    name: ci runner
    uses: ./.github/workflows/check.yaml
    with:
      fallback: ubuntu-latest  # This repo builds on Linux; typical users would use macos-latest

  build:
    needs: check
    runs-on: ${{ needs.check.outputs.runner }}
    steps:
      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Hostname: $(hostname)"

      - uses: actions/checkout@v4

      - name: Validate runner selection
        run: |
          echo "Selected runner: ${{ needs.check.outputs.runner }}"
          if [ -z "${{ needs.check.outputs.runner }}" ]; then
            echo "::error::Runner selection failed - output is empty"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 43 requires Node >= 22.12.0 (see engines in package.json).
          # Bounded both ways: a bare '22' would let setup-node reuse an older
          # 22.x from a self-hosted toolcache, while an open-ended lower bound
          # would float onto a new major as soon as one ships.
          node-version: '>=22.12.0 <23'
          # Only cache npm on GitHub-hosted runners (self-hosted has persistent storage)
          cache: ${{ needs.check.outputs.runner != 'self-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # A real docker CLI, a real daemon, and the filtering socket between them.
      # Outside a job it serves the socket itself over the runner's native
      # daemon; inside a localmost job it drives the socket the runner serves,
      # bound to this repository's own .localmostrc. It fails, never skips, when
      # Docker is absent - so it runs on every leg.
      - name: Run docker end-to-end
        run: npx playwright test test/e2e/docker.spec.ts --config test/playwright.config.ts

      - name: Build
        run: npm run build

      - name: Report runner info
        run: |
          echo "## Runner Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Name**: $RUNNER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Selected**: ${{ needs.check.outputs.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hostname**: $(hostname)" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: $(uname -a)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check.outputs.runner }}" = "self-hosted" ]; then
            echo "- **Type**: localmost self-hosted runner" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Type**: GitHub-hosted runner (fallback)" >> $GITHUB_STEP_SUMMARY
          fi
